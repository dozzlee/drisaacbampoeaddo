server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 101m;
  location = /teams { return 301 /teams/; }
  location /teams/ { proxy_pass http://frontend:3000; proxy_set_header Host $host; }
  location /teams-assets/ { proxy_pass http://frontend:3000; proxy_set_header Host $host; }
  location /_next/ { proxy_pass http://frontend:3000; proxy_set_header Host $host; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ =404; }
}
